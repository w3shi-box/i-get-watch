name: CTF Secret Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Save challenge secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          printf '%s' "$ANTHROPIC_API_KEY" > ctf-secret.txt

      - name: Upload challenge secret
        uses: actions/upload-artifact@v4
        with:
          name: ctf-secret
          path: ctf-secret.txt
